name: CI

# Build and test on every push and PR. Publish only on a version tag —
# deliberately not on every main commit. Package ids are permanent and a
# published version can't be replaced, so publishing should be something someone
# chose to do, not a side effect of merging.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - run: dotnet restore CaptainOfIndustry.slnx
      - run: dotnet build CaptainOfIndustry.slnx --configuration Release --no-restore

      # The real-install tests skip themselves on CI, where the game is absent.
      - run: dotnet test CaptainOfIndustry.slnx --configuration Release --no-build --verbosity normal

      - run: dotnet pack CaptainOfIndustry.slnx --configuration Release --no-build --output artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/*.nupkg
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: Production
    permissions:
      contents: read
      # Trusted publishing exchanges this OIDC token for a short-lived nuget.org
      # key. No long-lived API secret is stored anywhere.
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - run: dotnet pack CaptainOfIndustry.slnx --configuration Release --output artifacts

      - uses: NuGet/login@v1
        id: login
        with:
          # Set the NUGET_USER repository variable to the nuget.org account or
          # organisation that owns the trusted-publishing policy.
          user: ${{ vars.NUGET_USER }}

      - name: Push to nuget.org
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
