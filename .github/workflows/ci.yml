name: CI

# Everything goes through Fallout (./build.sh), so CI runs the same targets a
# developer runs locally. Publish only on a version tag — deliberately not on
# every main commit: package ids and versions are permanent and a published
# version can't be replaced, so publishing should be something someone chose.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Nerdbank.GitVersioning derives the version from git height, so it
          # needs the full history rather than a shallow clone.
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # The tests that need Captain of Industry installed skip themselves on CI.
      - run: ./build.sh Test --configuration Release

      - run: ./build.sh Pack --configuration Release

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/packages/*.nupkg
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # Must match the environment the nuget.org trusted-publishing policy is
    # bound to. Renaming it here breaks the token exchange at push time.
    environment: Production
    permissions:
      contents: read
      # Trusted publishing exchanges this OIDC token for a short-lived nuget.org
      # key. No long-lived API secret is stored anywhere.
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: NuGet/login@v1
        id: login
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Push to nuget.org
        run: >
          ./build.sh Push
          --configuration Release
          --nuget-source https://api.nuget.org/v3/index.json
          --nuget-api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
